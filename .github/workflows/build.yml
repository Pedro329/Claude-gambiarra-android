name: Gerar APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flet==0.23.2
      - run: flet build apk --module-name app --project claudeinfinite --product "Claude infinite"
      - uses: actions/upload-artifact@v4
        with:
          name: Claude-Infinite-APK
          path: build/apk/*.apk
